[project]
name = "lead-agent"
version = "0.1.0"
description = "AI agent that finds, researches and drafts outreach for qualified leads using LangGraph + Bright Data"
requires-python = ">=3.11"
dependencies = [
    "arq==0.28.0",
    "beautifulsoup4==4.15.0",
    "brightdata-sdk==2.5.2",
    "certifi==2026.7.22",
    "diskcache==5.6.3",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "langchain==1.4.3",
    "langchain-google-genai==4.4.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.12",
    "openpyxl==3.1.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "redis[hiredis]==5.3.1",
    "sqlmodel==0.0.47",
    "streamlit==1.65.0",
    "tenacity==9.1.4",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# Makes `app` an installed package, so `import app...` works from scripts/ and tests/.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
